# cxynb.mow.kdns.fr — 反向代理入口
#   /mtdd  -> 美团订单 (Rust meituan-rs :8899)
#   /syt   -> 收银台   (Python cashier   :5000)
# 前置 Cloudflare 已终结 TLS，本机只监听 80（Cloudflare Flexible 模式）。
# 若使用 Cloudflare Full/Strict，请在下方补充 listen 443 + 证书并改 X-Forwarded-Proto。

server {
    listen 80;
    server_name cxynb.mow.kdns.fr;

    # 根路径跳转到美团订单页
    location = / {
        return 302 /mtdd/;
    }

    # 美团订单（Rust meituan-rs）
    location = /mtdd { return 302 /mtdd/; }
    location /mtdd/ {
        proxy_pass http://127.0.0.1:8899/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 收银台（Python cashier）
    location = /syt { return 302 /syt/; }
    location /syt/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 避免浏览器根 favicon 请求打向后端
    location = /favicon.ico { return 204; }
}
